
<!DOCTYPE html>
<html>
<head>
    <title>Add Location</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { padding: 10px 20px; margin-right: 10px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>Add New Location</h2>
    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter location name">
    </div>
    <div class="form-group">
        <label for="description">Description:</label>
        <input type="text" id="description" placeholder="Enter description">
    </div>
    <div class="form-group">
        <label for="latitude">Latitude:</label>
        <input type="number" id="latitude" step="any" placeholder="Enter latitude">
    </div>
    <div class="form-group">
        <label for="longitude">Longitude:</label>
        <input type="number" id="longitude" step="any" placeholder="Enter longitude">
    </div>
    <button onclick="submitLocation()">Add Location</button>
    <button onclick="refreshMap()">Refresh Map</button>
    <div id="message"></div>

    <script>
        async function submitLocation() {
            const data = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                latitude: parseFloat(document.getElementById('latitude').value),
                longitude: parseFloat(document.getElementById('longitude').value)
            };

            try {
                const response = await fetch('http://localhost:8000/locations/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    document.getElementById('message').innerHTML = 
                        `<div class="success">Location '${data.name}' added successfully!</div>`;
                    refreshMap();
                } else {
                    throw new Error('Failed to add location');
                }
            } catch (error) {
                document.getElementById('message').innerHTML = 
                    `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function refreshMap() {
            window.location.reload();
        }
    </script>
</body>
</html>
